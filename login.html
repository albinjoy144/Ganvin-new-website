<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ganvin | Premium Professional Wardrobe & Laundry Care Services</title>
    <!-- Meta tags for SEO -->
    <meta name="description"
        content="Sign in to your Ganvin account. Book premium dry cleaning, steam ironing, and professional laundry services. Quick pickups and quality fabric care.">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/logo.ico">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="style.css?v=43">
    <link rel="stylesheet" href="login.css?v=3">

    <!-- Icon Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="login-page-body">

    <div class="login-container">
        <!-- Left Column - Form Side -->
        <div class="login-form-side">
            <a href="index.html" class="login-logo">
                <img src="assets/logo.png" alt="Ganvin Logo" class="login-logo-img">
            </a>

            <!-- Form Content Group (for vertical alignment matching promo side) -->
            <div class="login-form-content-wrapper">
                <!-- Header Group -->
                <div class="login-header-group">
                    <h1 class="login-title">Welcome back!</h1>
                    <p class="login-subtitle">Simplify your wardrobe care and enjoy premium professional laundry services. Get started for free.</p>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="login-form" autocomplete="on">
                    <!-- Username / Email / Mobile Input -->
                    <div class="form-group">
                        <label for="username-input" id="username-label" class="form-label">Mobile Number / Email <span>*</span></label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-user input-icon"></i>
                            <input type="text" id="username-input" class="login-input" placeholder="Enter Your Phone/Email" required autocomplete="username">
                        </div>
                    </div>

                    <!-- Password Input Group -->
                    <div class="form-group" id="password-group">
                        <label for="password-input" class="form-label">Password <span>*</span></label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" id="password-input" class="login-input" placeholder="Enter Your Password" autocomplete="current-password">
                            <button type="button" id="password-toggle" class="password-toggle-btn" aria-label="Toggle Password Visibility">
                                <i class="fa-solid fa-eye-slash"></i>
                            </button>
                        </div>
                    </div>

                    <!-- OTP Input Group (Hidden by default, shown when toggled) -->
                    <div class="form-group otp-input-group" id="otp-group">
                        <label class="form-label">Enter 4-Digit Verification OTP <span>*</span></label>
                        <div class="otp-input-container">
                            <input type="text" maxlength="1" class="otp-digit" aria-label="OTP Digit 1">
                            <input type="text" maxlength="1" class="otp-digit" aria-label="OTP Digit 2">
                            <input type="text" maxlength="1" class="otp-digit" aria-label="OTP Digit 3">
                            <input type="text" maxlength="1" class="otp-digit" aria-label="OTP Digit 4">
                        </div>
                    </div>

                    <!-- Form Options: Sign in with OTP & Forgot Password -->
                    <div class="form-options">
                        <a href="#" id="otp-toggle" class="otp-link">Sign in with OTP</a>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="login-btn" class="login-submit-btn">Signin</button>
                </form>
            </div>

            <!-- Bottom Registration Link -->
            <p class="login-footer-text">
                Didn't registered yet? <a href="#">Sign up</a>
            </p>
        </div>

        <!-- Right Column - Promo Graphic Card -->
        <div class="login-promo-side">
            <!-- Main Illustration GIF (Full Cover Background) -->
            <img src="assets/header-worker.gif" alt="Ganvin Laundry Care Worker" class="main-illustration-gif">

            <!-- Bottom Content Overlay: Indicators & Caption -->
            <div class="promo-text-container">
                <h2 id="promo-caption" class="promo-caption">
                    Experience premium care for your everyday wardrobe with <span>Ganvin</span>
                </h2>
                <div class="promo-dots">
                    <div class="promo-dot active" aria-label="Slide 1"></div>
                    <div class="promo-dot" aria-label="Slide 2"></div>
                    <div class="promo-dot" aria-label="Slide 3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="login.js"></script>
</body>

</html>
